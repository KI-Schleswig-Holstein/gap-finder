[project]
name = "gap-finder"
version = "0.1.0"
description = "Identify potential knowledge gaps in document collections using language models and topic modeling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ben Biesenbach", email = "bbi@informatik.uni-kiel.de" },
    { name = "Josef Küstner", email = "josef.kuestner@informatik.uni-kiel.de" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10"
dependencies = [
    "bertopic>=0.17.4",
    "faiss-cpu>=1.14.3",
    "jinja2>=3.1.6",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.46.0",
    "sentence-transformers>=5.6.0",
    "tqdm>=4.68.3",
    "unstructured[pdf]>=0.18.32,<0.23.1; python_version < '3.11'",
    "unstructured[pdf]>=0.23.1; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/KI-Schleswig-Holstein/gap-finder"
Repository = "https://github.com/KI-Schleswig-Holstein/gap-finder"
Issues = "https://github.com/KI-Schleswig-Holstein/gap-finder/issues"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "python-dotenv>=1.2.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "vs: vector-store integration tests (pdf -> chunk -> embed -> FaissVectorStore); downloads and runs a real embedding model (slow, needs network)",
    "llm: real chat-model integration tests; requires GAP_FINDER_RUN_LLM_INTEGRATION=1 and configured local/API models",
    "embedding: real embedding-model integration tests; requires GAP_FINDER_RUN_EMBEDDING_INTEGRATION=1 and configured local/API models",
]
